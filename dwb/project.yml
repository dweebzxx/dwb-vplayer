name: dwb
options:
  minimumXcodeGenVersion: "2.0"
  deploymentTarget:
    macOS: "13.0"
  bundleIdPrefix: com.dwb

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"

packages:
  vlckit-spm:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

targets:
  dwb:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: dwb
        excludes:
          - Resources/Info.plist
    resources:
      - path: dwb/Resources/Info.plist
      - path: dwb/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: dwb/Resources/Info.plist
        MARKETING_VERSION: "4.2.2"
        CURRENT_PROJECT_VERSION: "4.2.2"
        PRODUCT_BUNDLE_IDENTIFIER: com.dweebz.dwb-xtreme
        PRODUCT_NAME: "dwb xtreme"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: vlckit-spm
        product: VLCKitSPM

  dwbTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: dwbTests
      - path: dwb/Player/MediaFileSupportCore.swift
      - path: dwb/Player/PlaybackCompletionPolicy.swift
      - path: dwb/Player/QueueDisplayProjection.swift
      - path: dwb/App/DebugLogSanitizer.swift
      - path: dwb/App/BookmarkStore.swift
      - path: dwb/App/SettingsDefaultsRegistry.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwb.dwbTests
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""

schemes:
  dwb:
    build:
      targets:
        dwb: all

  dwbTests:
    build:
      targets:
        dwbTests: all
    test:
      targets:
        - dwbTests
