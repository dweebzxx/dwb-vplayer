name: dwb
options:
  minimumXcodeGenVersion: "2.0"
  deploymentTarget:
    macOS: "13.0"
  bundleIdPrefix: com.dwb

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"

packages:
  vlckit-spm:
    url: https://github.com/tylerjonesio/vlckit-spm
    from: "3.6.0"

targets:
  dwb:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: dwb
        excludes:
          - Resources/Info.plist
    resources:
      - path: dwb/Resources/Info.plist
      - path: dwb/Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: dwb/Resources/Info.plist
        MARKETING_VERSION: "2.0.1"
        CURRENT_PROJECT_VERSION: "201"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwb.dwb
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: vlckit-spm
        product: VLCKitSPM
